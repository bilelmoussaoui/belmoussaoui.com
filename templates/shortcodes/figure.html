<figure class="my-8">
  <img src="{{ src }}" {% if alt %}alt="{{ alt }}"{% elif caption %}alt="{{ caption }}"{% endif %} class="max-w-full mx-auto" loading="lazy">
  {% if caption %}
    <figcaption class="text-center text-sm text-gray-500 dark:text-gray-400 mt-2">{{ caption }}</figcaption>
  {% endif %}
</figure>
