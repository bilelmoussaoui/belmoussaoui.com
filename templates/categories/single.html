{% extends "_base.html" %}
{% block title %}{{ term.name }} - {{ config.title }}{% endblock %}

{% block content %}
  <div class="flex items-baseline justify-between mb-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">{{ term.name }}</h1>
    <a href="/categories" class="text-sm text-blue-600 dark:text-blue-400 hover:underline underline-offset-2">All categories</a>
  </div>
  <div class="space-y-3">
    {% for post in term.pages %}
      <a href="{{ post.permalink }}" class="flex justify-between items-baseline gap-4 group py-1">
        <span class="text-gray-800 dark:text-gray-200 group-hover:text-blue-600 dark:group-hover:text-blue-400 truncate">
          {{ post.title }}
        </span>
        <span class="text-sm text-gray-400 dark:text-gray-500 whitespace-nowrap flex-shrink-0 tabular-nums">
          {{ post.date | date(format="%b %-d, %Y") }}
        </span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
