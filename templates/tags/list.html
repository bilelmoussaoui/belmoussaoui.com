{% extends "_base.html" %}
{% block title %}Tags - {{ config.title }}{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-6">Tags</h1>
  <div class="flex flex-wrap gap-x-4 gap-y-2">
    {% for term in terms %}
      <a href="{{ term.permalink }}" class="text-blue-600 dark:text-blue-400 underline-offset-2 hover:underline">
        {{ term.name }} <span class="text-gray-400 dark:text-gray-500 text-sm">({{ term.pages | length }})</span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
